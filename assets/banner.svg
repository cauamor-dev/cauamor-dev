<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">Cauã Moreira — Software Developer · BH, Brazil</title>
<desc id="desc">Dark violet banner with slowly rotating orbital rings and softly glowing stars.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101018"/><stop offset="1" stop-color="#191326"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#9f7aea" stop-opacity=".18"/><stop offset="1" stop-color="#9f7aea" stop-opacity="0"/></radialGradient>
</defs>
<style>
.orbit{transform-origin:990px 140px;animation:orbit 32s linear infinite}
.reverse{animation-direction:reverse;animation-duration:46s}
.star{animation:glow 7s ease-in-out infinite alternate}
.late{animation-delay:-3s}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes glow{from{opacity:.25}to{opacity:.85}}
@media(prefers-reduced-motion:reduce){.orbit,.star{animation:none}}
</style>
<rect width="1200" height="280" rx="20" fill="url(#bg)"/>
<circle cx="990" cy="140" r="190" fill="url(#halo)"/>
<path d="M42 236H1158" stroke="#b498e6" stroke-opacity=".2"/>
<rect x="48" y="55" width="3" height="151" rx="1.5" fill="#b498e6"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="78" y="73" font-size="12" letter-spacing="3" fill="#9c92b3">CAUAMOR-DEV</text>
<text x="78" y="124" font-size="43" font-weight="600" fill="#f2eef8">Cauã Moreira</text>
<text x="78" y="164" font-size="23" fill="#c3abea">Software Developer</text>
<text x="78" y="198" font-size="16" fill="#a59bb5">Full Stack · BH, Brazil</text>
</g>
<g fill="none" stroke="#b498e6">
<circle cx="990" cy="140" r="58" stroke-opacity=".35"/>
<g class="orbit"><ellipse cx="990" cy="140" rx="116" ry="39" transform="rotate(-28 990 140)" stroke-opacity=".5"/>
<circle cx="1092" cy="85" r="4" fill="#cbb2f6" stroke="none"/></g>
<g class="orbit reverse"><ellipse cx="990" cy="140" rx="94" ry="34" transform="rotate(38 990 140)" stroke-opacity=".2"/>
<circle cx="1065" cy="199" r="2.5" fill="#b498e6" stroke="none"/></g>
</g>
<g fill="#cbb2f6"><circle class="star" cx="807" cy="63" r="2"/><circle class="star late" cx="1150" cy="203" r="2"/><circle class="star" cx="842" cy="202" r="1.5"/><circle class="star late" cx="1128" cy="48" r="1.5"/></g>
</svg>

